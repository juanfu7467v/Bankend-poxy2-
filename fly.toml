# fly.toml app configuration file generated for vankend-poxy2 on 2026-09-28T02:47:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vankend-poxy2'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
